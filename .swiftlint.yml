included:
  - Sources
  - Tests

excluded:
  - .build
  - .swiftpm
  - .worktrees
  - docs
  # DocC tutorial code snapshots are documentation fixtures, not shipped sources.
  - Sources/Shikisha/Shikisha.docc

opt_in_rules:
  - empty_count
  - explicit_init
  - fatal_error_message
  - first_where
  - multiline_parameters
  - redundant_nil_coalescing
  - sorted_first_last
  - vertical_parameter_alignment_on_call

# All rules are enabled. The two structural rules below are kept active but with
# thresholds raised above the default, because the only functions that exceed the
# defaults are inherently branchy wire-format decoders and the CSV tokenizer state
# machine — splitting them would hurt readability more than it helps.
cyclomatic_complexity:
  warning: 18
  error: 25

function_body_length:
  warning: 70
  error: 120

# Nested `CodingKeys` enums inside nested DTOs sit two levels deep — idiomatic for
# Codable wire shapes, so allow it.
nesting:
  type_level: 2

identifier_name:
  min_length:
    warning: 2
  validates_start_with_lowercase: false
  excluded:
    - id
    - SQLITE_TRANSIENT

large_tuple:
  warning: 4
  error: 5

force_cast: warning
force_try: warning
trailing_whitespace:
  ignores_empty_lines: true

reporter: "xcode"
