name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Swift 6.3
        uses: SwiftyLab/setup-swift@latest
        with:
          swift-version: "6.3.2"
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  lint:
    name: SwiftLint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: SwiftLint
        run: swiftlint lint --strict --config .swiftlint.yml

  app:
    name: Build SwiftUI App
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # The runner's Xcode bundles Swift tools < 6.3, but the package requires
      # 6.3. Install the 6.3 toolchain (as the test job does) and point
      # xcodebuild at it via TOOLCHAINS so it can resolve the package.
      - name: Install Swift 6.3
        uses: SwiftyLab/setup-swift@latest
        with:
          swift-version: "6.3.2"
      - name: Use the Swift 6.3 toolchain for xcodebuild
        run: |
          set -e
          if [ -z "$TOOLCHAINS" ]; then
            tc=$(ls -d /Library/Developer/Toolchains/swift-*.xctoolchain \
                       "$HOME/Library/Developer/Toolchains/swift-*.xctoolchain" 2>/dev/null | sort | tail -1)
            [ -n "$tc" ] || { echo "::error::no swift.org toolchain found"; exit 1; }
            id=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$tc/Info.plist")
            echo "Using $tc ($id)"
            echo "TOOLCHAINS=$id" >> "$GITHUB_ENV"
          else
            echo "TOOLCHAINS already set: $TOOLCHAINS"
          fi
      - name: Versions
        run: xcodebuild -version && swift --version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build (macOS)
        run: >
          xcodebuild build
          -project Shikisha.xcodeproj
          -scheme ShikishaChat
          -destination 'platform=macOS'
          -configuration Debug
          CODE_SIGNING_ALLOWED=NO
      - name: Build (iOS Simulator)
        run: >
          xcodebuild build
          -project Shikisha.xcodeproj
          -scheme ShikishaChat
          -destination 'generic/platform=iOS Simulator'
          -configuration Debug
          CODE_SIGNING_ALLOWED=NO
