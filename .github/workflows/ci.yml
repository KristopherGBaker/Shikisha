name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Swift 6.3
        uses: SwiftyLab/setup-swift@latest
        with:
          swift-version: "6.3.2"
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  lint:
    name: SwiftLint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: SwiftLint
        run: swiftlint lint --strict --config .swiftlint.yml

  app:
    name: Build SwiftUI App
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # The Shikisha package requires Swift tools 6.3, which the runner's
      # "latest stable" Xcode may not yet provide. Scan installed Xcodes and
      # select the newest one whose Swift is >= 6.3 (fail loudly if none).
      - name: Select an Xcode with Swift 6.3+
        run: |
          set -e
          best=""; bestver=""
          for app in /Applications/Xcode*.app; do
            sw="$app/Contents/Developer/usr/bin/swift"
            [ -x "$sw" ] || continue
            ver=$("$sw" --version 2>/dev/null | grep -oE 'Swift version [0-9]+\.[0-9]+' | grep -oE '[0-9]+\.[0-9]+' | head -1)
            echo "$app -> ${ver:-unknown}"
            [ -n "$ver" ] || continue
            maj=${ver%%.*}; min=${ver##*.}
            if [ "$maj" -gt 6 ] || { [ "$maj" -eq 6 ] && [ "$min" -ge 3 ]; }; then
              best="$app"; bestver="$ver"
            fi
          done
          if [ -z "$best" ]; then
            echo "::error::No installed Xcode has Swift 6.3+ (required by Package.swift)"
            exit 1
          fi
          echo "Selected $best (Swift $bestver)"
          echo "DEVELOPER_DIR=$best/Contents/Developer" >> "$GITHUB_ENV"
      - name: Versions
        run: xcodebuild -version && swift --version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build (macOS)
        run: >
          xcodebuild build
          -project Shikisha.xcodeproj
          -scheme ShikishaChat
          -destination 'platform=macOS'
          -configuration Debug
          CODE_SIGNING_ALLOWED=NO
      - name: Build (iOS Simulator)
        run: >
          xcodebuild build
          -project Shikisha.xcodeproj
          -scheme ShikishaChat
          -destination 'generic/platform=iOS Simulator'
          -configuration Debug
          CODE_SIGNING_ALLOWED=NO
